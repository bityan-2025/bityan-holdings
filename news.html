<main class="container fade-up">
  <section class="card news fade-up">
    <p class="news-eyebrow">ALL UPDATES</p>
    <h2>ニュース一覧</h2>
    <p class="news-intro">
      びちゃんホールディングスからのお知らせや活動情報をご紹介します。
    </p>

    <div id="newsList"></div>
  </section>
</main>

<script src="news-data.js"></script>
<script>
  const newsList = document.getElementById("newsList");

  newsList.innerHTML = newsData.map(news => `
    <article class="news-article" id="${news.id}">
      <p class="news-date">${news.date} · ${news.category}</p>
      <h2 class="news-article-title">${news.title}</h2>
      <p class="news-summary">${news.summary}</p>

      <div class="news-body">
        ${news.body.map(paragraph => `
          <p>${paragraph}</p>
        `).join("")}
      </div>

      <a class="news-back" href="index.html">トップページへ戻る →</a>
    </article>
  `).join("");
</script>

<footer class="news-footer">
  <a class="news-footer-brand" href="index.html">BITYAN HOLDINGS</a>
  <p>© 2026 びちゃんホールディングス</p>
  <p class="note">
    ※本サイトはWeb制作練習のために作成された架空の企業サイトです。
    掲載情報は架空のものです。
  </p>
</footer>

<script src="script.js"></script>
<script>
  const menuButton = document.getElementById("menuButton");
  const mainNav = document.getElementById("mainNav");

  if (menuButton && mainNav) {
    menuButton.addEventListener("click", () => {
      const isOpen = mainNav.classList.toggle("open");
      menuButton.textContent = isOpen ? "×" : "☰";
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute(
        "aria-label",
        isOpen ? "メニューを閉じる" : "メニューを開く"
      );
    });

    mainNav.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => {
        mainNav.classList.remove("open");
        menuButton.textContent = "☰";
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "メニューを開く");
      });
    });
  }
</script>

</body>
</html>
